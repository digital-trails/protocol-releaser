name: Move Major Tag

# Protocols run this action as `uses: uvamaplab/protocol-releaser@v1`. Publishing a release
# moves its major tag onto it (v1.9.1 moves v1), so every protocol's next release uses the
# newest v1 release and nothing newer until another release is published. Commits to main
# change nothing until then. A prerelease moves nothing.
#
# To point v1 back at an earlier release, or at any release by hand, run this workflow from
# the Actions tab with that release's tag.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag the major tag should point at, e.g. v1.8.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  move:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: point the major tag at the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          major="${TAG%%.*}"
          case "$major" in
            v[0-9]|v[0-9][0-9]) ;;
            *) echo "::error::'$TAG' does not start with a major version such as v1"; exit 1 ;;
          esac
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$major" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$major" -f sha="$sha" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$major" -f sha="$sha" >/dev/null
          fi
          echo "$major now points at $TAG ($sha)"
